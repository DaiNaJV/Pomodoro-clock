<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Clock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Pomodoro Clock</h1>

    <p id="session-label" class="session-label">Sesión de trabajo</p>

    <div class="timer" id="timer">25:00</div>

    <div class="controls">
      <button id="start-btn">Iniciar</button>
      <button id="pause-btn" disabled>Pausar</button>
      <button id="stop-btn" disabled>Detener</button>
      <button id="reset-btn">Reiniciar</button>
    </div>

    <section class="settings">
      <h2>Personalizar duración (minutos)</h2>
      <div class="settings-row">
        <label for="work-input">Trabajo</label>
        <input type="number" id="work-input" min="1" max="90" value="25" />
      </div>
      <div class="settings-row">
        <label for="break-input">Descanso corto</label>
        <input type="number" id="break-input" min="1" max="30" value="5" />
      </div>
      <div class="settings-row">
        <label for="long-break-input">Descanso largo</label>
        <input type="number" id="long-break-input" min="1" max="60" value="10" />
      </div>
      <p class="hint">Los cambios se aplican en el próximo ciclo o al reiniciar.</p>
    </section>

    <p class="cycle-counter">
      Ciclos de trabajo completados: <span id="cycle-count">0</span>
      <br />
      <small>Cada 4º descanso será un descanso largo.</small>
    </p>
  </main>

  <audio id="alarm-sound" src="alarm.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
