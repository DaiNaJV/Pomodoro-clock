<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 610" width="680" height="610">
<rect x="0" y="0" width="680" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">Flujo de estados de sesión del Pomodoro</text>

