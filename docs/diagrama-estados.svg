<svg width="820" height="600" viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Diagrama de estados - Pomodoro Clock</title>
  <desc>Flujo de sesiones del temporizador: Reposo, Trabajo, Descanso corto y Descanso largo, con las transiciones Iniciar, 00:00 y Detener.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#555555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#a35b3c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="600" fill="#ffffff"/>

  <text x="20" y="34" font-size="17" font-weight="600" fill="#2f2f47">Pomodoro Clock — diagrama de estados</text>

  <!-- Reposo -->
  <rect x="40" y="270" width="150" height="60" rx="10" fill="#f1f0f5" stroke="#8a8aa3" stroke-width="1"/>
  <text x="115" y="294" font-size="14" font-weight="600" text-anchor="middle" fill="#2f2f47">Reposo</text>
  <text x="115" y="314" font-size="11.5" text-anchor="middle" fill="#5f5f78">estado inicial</text>

  <!-- Trabajo -->
  <rect x="280" y="240" width="200" height="100" rx="10" fill="#fbeae6" stroke="#d85a30" stroke-width="1.3"/>
  <text x="380" y="278" font-size="14" font-weight="600" text-anchor="middle" fill="#712b13">Trabajo</text>
  <text x="380" y="298" font-size="11.5" text-anchor="middle" fill="#993c1d">25:00 · sesión activa</text>
  <text x="380" y="316" font-size="11.5" text-anchor="middle" fill="#993c1d">timer corriendo</text>

  <!-- Descanso corto -->
  <rect x="280" y="440" width="200" height="90" rx="10" fill="#e1f5ee" stroke="#1d9e75" stroke-width="1.3"/>
  <text x="380" y="475" font-size="14" font-weight="600" text-anchor="middle" fill="#085041">Descanso corto</text>
  <text x="380" y="495" font-size="11.5" text-anchor="middle" fill="#0f6e56">5:00</text>

  <!-- Descanso largo -->
  <rect x="580" y="440" width="200" height="90" rx="10" fill="#c0dde5" stroke="#0f6e56" stroke-width="1.3"/>
  <text x="680" y="470" font-size="14" font-weight="600" text-anchor="middle" fill="#085041">Descanso largo</text>
  <text x="680" y="490" font-size="11.5" text-anchor="middle" fill="#0f6e56">10:00</text>
  <text x="680" y="507" font-size="11.5" text-anchor="middle" fill="#0f6e56">cada 4to ciclo</text>

  <!-- Reposo -> Trabajo : Iniciar -->
  <line x1="190" y1="298" x2="278" y2="298" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="234" y="290" font-size="11.5" text-anchor="middle" fill="#2f2f47">Iniciar</text>

  <!-- Trabajo -> Reposo : Detener (dashed) -->
  <line x1="278" y1="330" x2="190" y2="330" stroke="#a35b3c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
  <text x="234" y="350" font-size="11" text-anchor="middle" fill="#a35b3c">Detener</text>

  <!-- Trabajo -> Descanso corto -->
  <line x1="345" y1="340" x2="345" y2="438" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="392" font-size="11.5" text-anchor="end" fill="#2f2f47">00:00 (ciclos 1-3)</text>

  <!-- Descanso corto -> Trabajo -->
  <line x1="425" y1="438" x2="425" y2="342" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="490" y="392" font-size="11.5" text-anchor="start" fill="#2f2f47">00:00 → nuevo ciclo</text>

  <!-- Trabajo -> Descanso largo (L path) -->
  <path d="M480 268 L560 268 L560 438" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="565" y="260" font-size="11.5" text-anchor="start" fill="#2f2f47">00:00 (cada 4to ciclo)</text>

  <!-- Descanso largo -> Trabajo (L path) -->
  <path d="M640 438 L640 210 L482 210" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="640" y="200" font-size="11.5" text-anchor="middle" fill="#2f2f47">00:00</text>

  <!-- Nota inferior -->
  <rect x="40" y="555" width="740" height="34" rx="6" fill="#f6f6f6" stroke="#dddddd" stroke-width="1"/>
  <text x="410" y="576" font-size="11.5" text-anchor="middle" fill="#5f5f78">
    Pausar / Reiniciar aplican dentro de cualquier estado activo (Trabajo, Descanso corto, Descanso largo) sin cambiar el estado.
  </text>
</svg>
