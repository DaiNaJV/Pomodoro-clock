<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Diagrama de flujo - controles del usuario</title>
  <desc>Flujo de interacción del usuario con los botones Iniciar, Pausar, Detener y Reiniciar del Pomodoro Clock.</desc>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#555555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="260" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#2f2f47">Flujo de controles del usuario</text>

  <!-- Detenido -->
  <rect x="30" y="90" width="150" height="60" rx="10" fill="#f1f0f5" stroke="#8a8aa3" stroke-width="1"/>
  <text x="105" y="125" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2f2f47">Detenido</text>

  <!-- Corriendo -->
  <rect x="330" y="90" width="150" height="60" rx="10" fill="#fbeae6" stroke="#d85a30" stroke-width="1.3"/>
  <text x="405" y="125" font-size="13.5" font-weight="600" text-anchor="middle" fill="#712b13">Corriendo</text>

  <!-- Pausado -->
  <rect x="630" y="90" width="150" height="60" rx="10" fill="#faeeda" stroke="#854f0b" stroke-width="1.3"/>
  <text x="705" y="125" font-size="13.5" font-weight="600" text-anchor="middle" fill="#633806">Pausado</text>

  <!-- Detenido -> Corriendo -->
  <line x1="180" y1="120" x2="328" y2="120" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="254" y="112" font-size="11.5" text-anchor="middle" fill="#2f2f47">Iniciar</text>

  <!-- Corriendo -> Pausado -->
  <line x1="480" y1="110" x2="628" y2="110" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="554" y="102" font-size="11.5" text-anchor="middle" fill="#2f2f47">Pausar</text>

  <!-- Pausado -> Corriendo -->
  <line x1="628" y1="135" x2="480" y2="135" stroke="#555555" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="554" y="153" font-size="11.5" text-anchor="middle" fill="#2f2f47">Iniciar</text>

  <!-- Corriendo -> Detenido (Detener) -->
  <path d="M405 152 L405 210 L105 210 L105 152" fill="none" stroke="#a35b3c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text x="255" y="228" font-size="11.5" text-anchor="middle" fill="#a35b3c">Detener (desde Corriendo o Pausado)</text>

  <!-- Corriendo self loop: Reiniciar -->
  <path d="M405 88 C 380 55, 430 55, 405 88" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow2)"/>
  <text x="405" y="45" font-size="11.5" text-anchor="middle" fill="#2f2f47">Reiniciar (misma sesión)</text>
</svg>
